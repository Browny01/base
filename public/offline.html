<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Bridge — Offline</title>
    <style>
      :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0b;color:#f4f4f5;padding:24px}
      main{width:min(420px,100%);border:1px solid #252529;border-radius:18px;background:#141416;padding:28px}
      img{width:38px;height:38px;opacity:.9}h1{font-size:22px;margin:20px 0 8px;letter-spacing:-.03em}
      p{color:#9c9ca3;font-size:14px;line-height:1.6;margin:0 0 22px}
      button{appearance:none;border:1px solid #f4f4f5;border-radius:10px;background:#f4f4f5;color:#0a0a0b;font-weight:700;padding:11px 15px;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <img src="/bridge-mark.png" alt="" />
      <h1>Bridge is offline</h1>
      <p>Your saved workspace is still on this device. Reopen a page you’ve visited before, or retry when the connection returns.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
