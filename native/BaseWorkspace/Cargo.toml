[package]
name = "base-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pbkdf2 = "0.12"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
fs2 = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
