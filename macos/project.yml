# XcodeGen spec for the native macOS Bridge app.
#
# Regenerate the Xcode project after editing this file (or after a fresh clone):
#   cd macos && xcodegen generate && open Bridge.xcodeproj
#
# The app uses shared native SwiftUI screens and an offline-first local store.
# Native-code changes ship via Sparkle auto-update (see scripts/release_mac.sh).
name: Bridge
options:
  bundleIdPrefix: app.bridge
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "5.0"
    # Ad-hoc sign so the app has a stable identity and runs on this Mac without a
    # paid Developer ID. Sparkle secures updates with EdDSA, independent of this.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: false
    CODE_SIGNING_ALLOWED: true

targets:
  Bridge:
    type: application
    platform: macOS
    sources:
      - path: Bridge
      - path: ../native/BridgeCore
        name: BridgeCore
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Bridge
        PRODUCT_BUNDLE_IDENTIFIER: app.bridge.personal.mac
        INFOPLIST_FILE: Bridge/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Bridge"
