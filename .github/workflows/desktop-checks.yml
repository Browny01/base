name: Desktop migration checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node --no-warnings --experimental-strip-types --test tests/security-backports.test.mts
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - run: cargo audit --file native/BaseWorkspace/Cargo.lock
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libgtk-3-dev libappindicator3-dev libxdo-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: npm run typecheck && npm run desktop:typecheck && npm run lint && npm test
      - run: npm run build && npm run desktop:frontend
      - name: Build workspace service required by Tauri
        run: npm run workspace:bundle
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm run desktop:build -- --no-bundle
      # A compile on a hosted runner does not replace manual desktop runtime,
      # signing, updater and offline/reconnection checks on actual hardware.
  ios-widget-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
