name: Desktop release candidate
on:
  workflow_dispatch:
    inputs:
      publish_updater:
        description: Publish signed updates to the existing feed (separate from draft GitHub release)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: base-desktop-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundles: appimage,deb
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            native/BaseWorkspace
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev libxdo-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: npm test && npm run desktop:typecheck && npm run web:typecheck && npm run cloud:check
      - run: cargo test --manifest-path native/BaseWorkspace/Cargo.toml --locked
      - name: Build platform installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BASE_UPDATER_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BASE_UPDATER_SIGNING_PASSWORD }}
          SIGN_UPDATES: ${{ inputs.publish_updater }}
        run: |
          args=(--target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}')
          if [ "$SIGN_UPDATES" = true ]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure BASE_UPDATER_SIGNING_KEY before publishing updates.'; exit 1; }
            args+=(--config src-tauri/tauri.release.conf.json)
          fi
          npm run desktop:build -- "${args[@]}"
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - uses: actions/upload-artifact@v4
        with:
          name: base-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Assemble and verify complete download set
        run: |
          mkdir downloads
          find release-artifacts -type f -exec cp '{}' downloads/ \;
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          git archive --format=zip --prefix="base-$version/" --output="downloads/Base-$version-source.zip" HEAD
          test -n "$(find downloads -name '*aarch64.dmg' -print -quit)"
          test -n "$(find downloads -name '*x64.dmg' -print -quit)"
          test -n "$(find downloads -name '*.exe' -print -quit)"
          test -n "$(find downloads -name '*.AppImage' -print -quit)"
          test -n "$(find downloads -name '*.deb' -print -quit)"
          (cd downloads && sha256sum * > SHA256SUMS.txt)
      - name: Create or update draft only; never publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft > /tmp/base-release.json 2>/dev/null; then
            node -e "if(!require('/tmp/base-release.json').isDraft)throw Error('Refusing to replace a published release')"
          else
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "Base $version preview" --notes-file docs/release-notes-0.1.9.md
          fi
          gh release upload "$tag" downloads/* --clobber
  publish-updater:
    if: inputs.publish_updater
    needs: [build, draft]
    runs-on: ubuntu-24.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish all platforms after every build passes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RELEASE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          linux=$(find release-artifacts/base-linux-x86_64 -name '*.AppImage' -type f)
          arm=$(find release-artifacts/base-darwin-aarch64 -name '*.tar.gz' -type f)
          intel=$(find release-artifacts/base-darwin-x86_64 -name '*.tar.gz' -type f)
          windows=$(find release-artifacts/base-windows-x86_64 -name '*.exe' -type f)
          node scripts/publish-desktop-release.mjs "linux-x86_64=$linux" "darwin-aarch64=$arm" "darwin-x86_64=$intel" "windows-x86_64=$windows"
