name: Signed desktop release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-desktop-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundles: appimage
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev libxdo-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: npm test && npm run desktop:typecheck
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BASE_UPDATER_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BASE_UPDATER_SIGNING_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure BASE_UPDATER_SIGNING_KEY before releasing.'; exit 1; }
          npm run desktop:build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: base-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish all platforms after every build passes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RELEASE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          linux=$(find release-artifacts/base-linux-x86_64 -name '*.AppImage' -type f)
          arm=$(find release-artifacts/base-darwin-aarch64 -name '*.tar.gz' -type f)
          intel=$(find release-artifacts/base-darwin-x86_64 -name '*.tar.gz' -type f)
          node scripts/publish-desktop-release.mjs "linux-x86_64=$linux" "darwin-aarch64=$arm" "darwin-x86_64=$intel"
